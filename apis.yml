name: Zeni
description: >-
  Zeni is an AI-powered bookkeeping and finance platform for startups and growing
  businesses, combining machine-learning automation with a dedicated human finance
  team. It connects to bank accounts, credit cards, payment platforms, and accounting
  systems to automatically capture and categorize transactions, reconcile accounts,
  and produce real-time financial dashboards and reports. Alongside AI bookkeeping,
  Zeni offers bill pay, employee reimbursements, business checking accounts and credit
  cards, payroll, tax accounting, and fractional CFO services. Zeni also ships a hosted,
  read-only MCP (Model Context Protocol) server that lets AI assistants such as Claude,
  OpenAI Codex, and Google Antigravity securely read a company's live Zeni financials
  via OAuth. The company reports managing more than $20B in transactions annually.
